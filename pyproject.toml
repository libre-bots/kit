[project]
name = "librebots-kit"
version = "0.0.0"
description = "Shared functions and extensions every Libre Bot uses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Libre Bots" }]
requires-python = ">=3.12"
dependencies = [
    "hikari>=2.6.0",
    "hikari-lightbulb>=3.2.7",
    "hikari-risa>=1.3.0",
    "librebots-hub>=0.1.0",
    "msgspec>=0.22.0",
]

[project.urls]
Source = "https://github.com/libre-bots/kit"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
    # 1.85.0.20261122 needs _typeshed.FloatInt, which the newest pyright does not ship yet
    "types-grpcio<1.85.0.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librebots"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src/librebots/kit", "tests"]
extraPaths = ["src"]
